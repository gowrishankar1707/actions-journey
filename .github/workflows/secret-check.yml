name: prove the secret reaches a run
on: push      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}        
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token is available to this step"
          else
            echo "Variable is not set"
            exit 1
          fi
